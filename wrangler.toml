name = "monolingo-bot"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Non-secret config. Secrets are set via `wrangler secret put` (see README).
[vars]
# GitHub repo that holds words.json, in "owner/repo" form
GITHUB_REPO = "cosmiczilch/monolingo"
GITHUB_BRANCH = "main"
WORDS_PATH = "words.json"
# Comma-separated Telegram user IDs allowed to use the bot.
# Leave empty for first deploy: message the bot and it will tell you your ID.
ALLOWED_USER_IDS = "417641946,223112715,8330024917"
# Claude model used for enrichment
CLAUDE_MODEL = "claude-haiku-4-5"

# Flashcard PWA static files, served from the same Worker
[assets]
directory = "./public"
